name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.14.1", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: bash scripts/verify.sh
        env:
          DOCS_SUBPATH_BASE: /${{ github.event.repository.name }}/
      # Exercise the release-only scripts on every push so a break surfaces
      # here rather than when a tag is already published. Both are offline and
      # need no credentials; neither publishes anything
      - if: ${{ matrix.node-version == '24.14.1' }}
        run: bash scripts/deploy-checks.sh
      - if: ${{ matrix.node-version == '24.14.1' }}
        run: bash scripts/release-artifacts.sh
      - if: ${{ matrix.node-version == '24.14.1' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: stowplan-sbom.cdx.json
  browser-shards:
    name: Browser shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium webkit
      - run: bash scripts/verify-browser.sh --config=playwright.ci.config.ts
        env:
          STOWPLAN_BROWSER_SHARD: ${{ matrix.shard }}
      # Traces for retried attempts are the only evidence an intermittent
      # failure leaves behind, and the run that produced them is where they
      # would otherwise be discarded. Upload them even when the job passes,
      # because a recovered flake still reports success
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/**/trace.zip
            test-results/results.json
          if-no-files-found: ignore
          retention-days: 30
  browser:
    if: ${{ always() }}
    needs: browser-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARD_RESULT" = success
