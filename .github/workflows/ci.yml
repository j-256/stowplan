name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.14.1", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: bash scripts/verify.sh
        env:
          DOCS_SUBPATH_BASE: /${{ github.event.repository.name }}/
      # Exercise the release-only scripts on every push so a break surfaces
      # here rather than when a tag is already published. Both are offline and
      # need no credentials; neither publishes anything
      - if: ${{ matrix.node-version == '24.14.1' }}
        run: bash scripts/deploy-checks.sh
      - if: ${{ matrix.node-version == '24.14.1' }}
        run: bash scripts/release-artifacts.sh
      - if: ${{ matrix.node-version == '24.14.1' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: stowplan-sbom.cdx.json
  browser-shards:
    name: Browser shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium webkit
      - run: bash scripts/verify-browser.sh --config=playwright.ci.config.ts
        env:
          STOWPLAN_BROWSER_SHARD: ${{ matrix.shard }}
      # Traces for retried attempts are the only evidence an intermittent
      # failure leaves behind, and the run that produced them is where they
      # would otherwise be discarded. Upload them even when the job passes,
      # because a recovered flake still reports success
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/**/trace.zip
            test-results/results.json
          if-no-files-found: ignore
          retention-days: 30
  browser:
    if: ${{ always() }}
    needs: browser-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARD_RESULT" = success

  cover:
    name: Build project cover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - name: Retain generated project cover
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [verify, browser, cover]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: ${{ runner.temp }}/project-cover
      - name: Commit changed cover from this build
        env:
          COVER_ARTIFACT: ${{ runner.temp }}/project-cover/cover.png
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          cp "$COVER_ARTIFACT" docs/screenshots/cover.png
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/cover.png
          git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
          git push origin HEAD:main
