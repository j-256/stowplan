name: Documentation
on:
  push:
    branches: [main]
    paths: ["docs/**", "package.json", "package-lock.json", ".nvmrc", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run docs:build && npm run docs:check
        env:
          DOCS_APPLICATION_URL: ${{ vars.DOCS_APPLICATION_URL }}
          DOCS_BASE: /${{ github.event.repository.name }}/
          DOCS_PRIVACY_POLICY_URL: ${{ vars.DOCS_PRIVACY_POLICY_URL }}
          DOCS_TERMS_OF_SERVICE_URL: ${{ vars.DOCS_TERMS_OF_SERVICE_URL }}
          DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
