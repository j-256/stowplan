name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/verify.sh
        env:
          DOCS_PAGES_BASE: /${{ github.event.repository.name }}/
      - run: bash scripts/deploy-checks.sh
      - run: bash scripts/release-artifacts.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" stowplan-sbom.cdx.json --verify-tag --generate-notes --title "Stowplan $GITHUB_REF_NAME"
