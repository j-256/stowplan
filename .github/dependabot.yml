version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: America/Chicago
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
        # Review Vinext separately because it bundles production runtime code
        # and its transitive dependencies can fail the repository-wide audit
        exclude-patterns:
          - vinext
    # The Next lint config bundles plugins that pin their own toolchain peers, so
    # a major bump of either tool below breaks lint for the whole grouped update
    # while every other package in it is fine. Hold both back and drop the entry
    # once the bundled plugins accept the new major
    ignore:
      # Vinext 0.0.46 through 0.2.1 pin vulnerable image-size 2.0.2
      # Resume proposals when Vinext ships beyond the affected range
      - dependency-name: vinext
        versions: [">=0.0.46 <=0.2.1"]
      # typescript-eslint declares typescript <6.1 and refuses to load under 7.
      # Blocked upstream on asynchronous ESLint parser support, not a release
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react declares eslint <=9 and calls context.getFilename(),
      # removed in ESLint 10
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "00:30"
      timezone: America/Chicago
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "01:00"
      timezone: America/Chicago
    groups:
      all-images:
        patterns:
          - "*"
