name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium webkit
      - run: npm run verify:ready
        env:
          DOCS_PAGES_BASE: /${{ github.event.repository.name }}/
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 30
      - run: bash scripts/deploy-checks.sh
      - run: bash scripts/release-artifacts.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" stowplan-sbom.cdx.json --verify-tag --generate-notes --title "Stowplan $GITHUB_REF_NAME"
