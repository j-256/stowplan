name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/docs-publication.mjs
      - package.json
      - package-lock.json
      - wrangler.docs.jsonc
      - .nvmrc
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  verify:
    name: Verify documentation artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and check documentation
        run: npm run docs:build && npm run docs:check
        env:
          DOCS_APPLICATION_URL: ${{ vars.DOCS_APPLICATION_URL }}
          DOCS_BASE: /
          DOCS_PRIVACY_POLICY_URL: ${{ vars.DOCS_PRIVACY_POLICY_URL }}
          DOCS_TERMS_OF_SERVICE_URL: ${{ vars.DOCS_TERMS_OF_SERVICE_URL }}
          DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Stamp verified source revision
        run: npm run docs:publish:stamp -- --revision "${GITHUB_SHA}"
      - name: Validate documentation Worker
        run: npm run deploy:docs:dry-run
      - name: Upload verified documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish documentation
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    needs: verify
    environment:
      name: documentation
      url: https://docs.stowplan.lasers.app
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download exact verified documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: docs/.vitepress/dist
      - name: Deploy exact verified documentation artifact
        run: npm run deploy:docs -- --message "GitHub Actions ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
      - name: Verify exact public documentation revision
        run: npm run docs:publish:verify -- --revision "${GITHUB_SHA}" --attempts 6 --delay-ms 10000
