name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: DOCS_BASE=/${{ github.event.repository.name }}/ npm run docs:build && DOCS_BASE=/${{ github.event.repository.name }}/ npm run docs:check
      - run: DOCS_BASE=/ npm run docs:build && DOCS_BASE=/ npm run docs:check
      - run: npm run build
      - run: npm run test:render
      - run: npm run build:next
      - run: npm run test:node-smoke
      - run: npx wrangler d1 migrations apply stowplan --local --config wrangler.jsonc
      - run: npm run test:next-dev-smoke
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - run: bash -n scripts/cloudflare-access.sh scripts/cloudflare-edge.sh scripts/github-pages.sh
      - run: bash scripts/cloudflare-access.sh check
      - run: bash scripts/cloudflare-edge.sh check
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > stowplan-sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" stowplan-sbom.cdx.json --verify-tag --generate-notes --title "Stowplan $GITHUB_REF_NAME"
